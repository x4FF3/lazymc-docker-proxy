name: Build And Push Docker Image
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build And Push
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # GHCR rejects image names containing uppercase letters, and this fork
      # lives under "x4FF3". metadata-action lowercases the tags it generates,
      # but attest-build-provenance consumes IMAGE_NAME verbatim, so normalise
      # it once here for every consumer. Deliberately not set as a job-level
      # env var: that would collide with this value at step scope.
      - name: Normalise image name
        run: echo "IMAGE_NAME=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: docker
        uses: ./.github/actions/docker
        with:
          publish: true
